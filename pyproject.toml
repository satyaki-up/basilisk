[project]
name = "basilisk"
version = "0.1.0"
description = "Multi-head attention"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "einops>=0.8.2",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
